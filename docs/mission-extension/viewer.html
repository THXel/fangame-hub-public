<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>PinguLexa Community Mission</title>
  <link rel="stylesheet" href="viewer.css">
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="config.js" defer></script>
  <script src="viewer.js" defer></script>
</head>
<body>
  <main id="app" class="app is-loading" aria-live="polite">
    <div class="aurora" aria-hidden="true"></div>
    <div id="thumb" class="thumb" aria-hidden="true"></div>
    <header class="header">
      <button id="hubLink" class="brand" type="button" title="Open THXel Fangame Hub">
        <span class="brand-icon">🐧</span>
        <span>PinguLexa Mission</span>
      </button>
      <span id="state" class="state">LOADING</span>
    </header>

    <section class="hero">
      <p class="eyebrow">COMMUNITY GOAL</p>
      <h1 id="title">Community Mission</h1>
      <p id="description" class="description">Loading current progress…</p>
    </section>

    <section class="overall-card">
      <div class="overall-row">
        <span id="overallLabel">Overall Progress</span>
        <strong id="overallPercent">0%</strong>
      </div>
      <div class="liquid-bar overall-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="overallFill" class="liquid-fill"><span class="wave"></span><span class="shine"></span></div>
      </div>
      <div class="overall-footer">
        <span id="overallDisplay">0 / 0</span>
        <span id="remaining"></span>
      </div>
    </section>

    <section id="goals" class="goals"></section>

    <footer class="footer">
      <span id="updated">Not updated yet</span>
      <button id="refresh" type="button">↻ Refresh</button>
    </footer>

    <section id="error" class="error" hidden>
      <strong>Mission currently unavailable</strong>
      <span>The latest published progress could not be loaded.</span>
    </section>
  </main>
</body>
</html>
